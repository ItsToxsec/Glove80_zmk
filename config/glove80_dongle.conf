# The dongle is now the HID device, so it needs the host-facing settings that
# glove80_lh_defconfig used to provide.

# The layout uses mouse move/scroll keys and the mouse-layer input processors.
CONFIG_ZMK_POINTING=y

# macOS chokes on the two-byte consumer report space.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Caps/num/scroll lock state from the host, and USB boot protocol for BIOS/EFI.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_USB_BOOT=y

# Pairing behaviour matching the Glove80's stock firmware.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Higher radio power, both towards the host and the two halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report each half's battery level to the host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
